<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake — built from one prompt</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0a0a12; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "DejaVu Sans", system-ui, sans-serif; color: #e8e8f0;
    user-select: none; -webkit-user-select: none;
  }
  h1 {
    margin: 0 0 8px; font-size: 64px; letter-spacing: 14px; font-weight: 800;
    color: #39ff6a; text-shadow: 0 0 24px rgba(57,255,106,.45);
  }
  .sub { margin: 0 0 24px; font-size: 26px; color: #8a8aa0; letter-spacing: 4px; }
  #score {
    font-size: 44px; font-weight: 700; margin-bottom: 20px; color: #fff;
    font-family: "DejaVu Sans Mono", monospace;
  }
  #score b { color: #39ff6a; }
  #board {
    width: 900px; height: 900px; background: #10101c; border: 3px solid #26263a;
    border-radius: 18px; box-shadow: 0 0 60px rgba(57,255,106,.12);
    display: block; touch-action: none;
  }
  .hint { margin-top: 26px; font-size: 26px; color: #8a8aa0; letter-spacing: 2px; }
  .hint kbd {
    background: #1c1c2c; border: 1px solid #3a3a52; border-radius: 8px;
    padding: 4px 12px; font-family: "DejaVu Sans Mono", monospace; color: #e8e8f0;
  }
  #over {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    flex-direction: column; background: rgba(10,10,18,.82); z-index: 10;
  }
  #over .big { font-size: 84px; font-weight: 800; color: #ff3b5c; letter-spacing: 6px; }
  #over .final { font-size: 40px; margin: 18px 0 34px; color: #fff; }
  #over button {
    font-size: 34px; padding: 18px 54px; border: none; border-radius: 14px;
    background: #39ff6a; color: #06210f; font-weight: 800; cursor: pointer;
  }
</style>
</head>
<body>
  <h1>SNAKE</h1>
  <p class="sub">ONE PROMPT &middot; ONE FILE &middot; BUILT BY AN AI AGENT</p>
  <div id="score">SCORE <b>0</b></div>
  <canvas id="board" width="900" height="900"></canvas>
  <p class="hint"><kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd> or <kbd>WASD</kbd> to steer &middot; eat the red dots</p>
  <div id="over">
    <div class="big">GAME OVER</div>
    <div class="final">Score: <span id="finalScore">0</span></div>
    <button id="again">PLAY AGAIN</button>
  </div>
<script>
(function () {
  'use strict';
  var GRID = 20, CELL = 45;              // 20x20 grid, 900px board
  var canvas = document.getElementById('board');
  var ctx = canvas.getContext('2d');
  var scoreEl = document.querySelector('#score b');
  var overEl = document.getElementById('over');
  var finalEl = document.getElementById('finalScore');

  var snake, dir, nextDir, food, score, speed, timer, alive;

  function emptyCell() {
    var c;
    do {
      c = { x: (Math.random() * GRID) | 0, y: (Math.random() * GRID) | 0 };
    } while (snake.some(function (s) { return s.x === c.x && s.y === c.y; }));
    return c;
  }

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 }; nextDir = dir;
    food = emptyCell();
    score = 0; speed = 150; alive = true;
    scoreEl.textContent = '0';
    overEl.style.display = 'none';
    clearInterval(timer);
    timer = setInterval(step, speed);
    draw();
  }

  function step() {
    if (!alive) return;
    dir = nextDir;
    var head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    // walls or self-collision end the game
    if (head.x < 0 || head.y < 0 || head.x >= GRID || head.y >= GRID ||
        snake.some(function (s) { return s.x === head.x && s.y === head.y; })) {
      return gameOver();
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = String(score);
      food = emptyCell();
      // speed rises as you eat, down to a 70ms floor
      if (speed > 70) { speed -= 6; clearInterval(timer); timer = setInterval(step, speed); }
    } else {
      snake.pop();
    }
    draw();
  }

  function draw() {
    ctx.fillStyle = '#10101c';
    ctx.fillRect(0, 0, 900, 900);
    // faint grid
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    for (var i = 1; i < GRID; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, 900); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(900, i * CELL); ctx.stroke();
    }
    // food
    ctx.fillStyle = '#ff3b5c';
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * 0.36, 0, Math.PI * 2);
    ctx.fill();
    // snake: neon green, brighter head
    snake.forEach(function (s, i) {
      ctx.fillStyle = i === 0 ? '#a4ffb8' : '#39ff6a';
      var p = 3;
      ctx.fillRect(s.x * CELL + p, s.y * CELL + p, CELL - p * 2, CELL - p * 2);
    });
  }

  function gameOver() {
    alive = false;
    clearInterval(timer);
    finalEl.textContent = String(score);
    overEl.style.display = 'flex';
  }

  var KEYS = {
    ArrowUp: { x: 0, y: -1 }, KeyW: { x: 0, y: -1 },
    ArrowDown: { x: 0, y: 1 }, KeyS: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 }, KeyA: { x: -1, y: 0 },
    ArrowRight: { x: 1, y: 0 }, KeyD: { x: 1, y: 0 }
  };
  document.addEventListener('keydown', function (e) {
    var d = KEYS[e.code];
    if (!d) return;
    e.preventDefault();
    // never reverse straight into yourself
    if (d.x !== -dir.x || d.y !== -dir.y) nextDir = d;
  });
  document.getElementById('again').addEventListener('click', reset);

  // Demo autopilot (?demo=1): steer toward the food, never into a wall or the body.
  // Same game, same rules — it only presses the keys for the recording.
  if (new URLSearchParams(location.search).get('demo') === '1') {
    setInterval(function () {
      if (!alive) { reset(); return; }
      var h = snake[0];
      var cands = [
        { x: 1, y: 0 }, { x: -1, y: 0 }, { x: 0, y: 1 }, { x: 0, y: -1 }
      ].filter(function (d) {
        if (d.x === -dir.x && d.y === -dir.y) return false;
        var nx = h.x + d.x, ny = h.y + d.y;
        if (nx < 0 || ny < 0 || nx >= GRID || ny >= GRID) return false;
        return !snake.some(function (s, i) {
          return i < snake.length - 1 && s.x === nx && s.y === ny;
        });
      });
      if (!cands.length) return;
      cands.sort(function (a, b) {
        var da = Math.abs(h.x + a.x - food.x) + Math.abs(h.y + a.y - food.y);
        var db = Math.abs(h.x + b.x - food.x) + Math.abs(h.y + b.y - food.y);
        return da - db;
      });
      nextDir = cands[0];
    }, 90);
  }

  reset();
})();
</script>
</body>
</html>
